apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-gateway
spec:
  rules:
    - host: innova-park.fabri.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 8080
  ingressClassName: public