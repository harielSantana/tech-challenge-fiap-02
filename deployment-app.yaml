apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deploy
  labels:
    app: app-innova-park
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-innova-park
  template:
    metadata:
      labels:
        app: app-innova-park
    spec:
      containers:
        - name: app-innova-park
          image: localhost:32000/app-fiap:registry
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-config
                  key: MONGODB_HOST
            - name: MONGODB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-config
                  key: MONGODB_PORT
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-config
                  key: MONGODB_DB
            - name: MONGODB_USER
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-config
                  key: MONGODB_USER
            - name: MONGODB_PASS
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-config
                  key: MONGODB_PASS
            - name: MONGODB_AUTH_DB
              valueFrom:
                configMapKeyRef:
                  name: mongo-db-config
                  key: MONGODB_AUTH_DB
